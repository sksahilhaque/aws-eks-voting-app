---
apiVersion: v1
kind: Namespace
metadata:
  name: voting-appllication
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: voting-appllication
  name: voting-app
  labels:
    app.kubernetes.io/name: voting-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: voting-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voting-app
    spec:
      containers:
        - name: voting-app
          image: dockersamples/examplevotingapp_vote
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  namespace: voting-appllication
  name: voting-service
spec:
  selector:
    app.kubernetes.io/name: voting-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: voting-appllication
  name: voting-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /vote
            pathType: Prefix
            backend:
              service:
                name: voting-service
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: voting-appllication
  name: result-deployment
  labels:
    app.kubernetes.io/name: result-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: result-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: result-app
    spec:
      containers:
        - name: result-app
          image: dockersamples/examplevotingapp_result
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  namespace: voting-appllication
  name: result-service
spec:
  selector:
    app.kubernetes.io/name: result-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: voting-app
  name: result-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /result
            pathType: Prefix
            backend:
              service:
                name: result-service
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: voting-appllication
  name: worker-deployment
  labels:
    app.kubernetes.io/name: worker-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-app
    spec:
      containers:
        - name: worker-app
          image: dockersamples/examplevotingapp_worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: voting-appllication
  name: redis-deployment
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  namespace: voting-app
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: voting-appllication
  name: postgres-deployment
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: postgres
---
apiVersion: v1
kind: Service
metadata:
  namespace: voting-app
  name: db
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
